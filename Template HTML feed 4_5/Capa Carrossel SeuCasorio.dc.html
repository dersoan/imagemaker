<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="./image-slot.js"></script>
<style>
  body { margin: 0; background: #EDE7DC; }
  a { color: #C8870B; text-decoration: none; }
  a:hover { color: #8A5A08; }
</style>
</helmet>

<div style="position:relative;width:1080px;height:1430px;overflow:hidden;background:#FBF7EF;font-family:Montserrat,sans-serif">

  <div style="position:absolute;inset:0;left:38%">
    <image-slot id="capa-foto" shape="rect" fit="cover" placeholder="Arraste a foto do casal aqui"></image-slot>
  </div>

  <div style="position:absolute;top:0;left:30%;width:28%;height:100%;background:linear-gradient(to right,#FBF7EF 0%,#FBF7EF 40%,rgba(251,247,239,0.85) 65%,rgba(251,247,239,0) 100%);pointer-events:none"></div>
  <div style="position:absolute;top:0;left:0;width:31%;height:100%;background:#FBF7EF;pointer-events:none"></div>

  <div style="position:absolute;top:0;left:0;width:76px;height:76px;background:#C8870B;pointer-events:none"></div>
  <div style="position:absolute;top:76px;left:22px;width:54px;height:54px;background:#E9A81C;pointer-events:none"></div>
  <div style="position:absolute;top:76px;left:0;width:22px;height:22px;background:#C8870B;pointer-events:none"></div>

  <div style="position:absolute;top:170px;left:110px;width:640px;pointer-events:none;white-space:nowrap">
    <div style="display:flex;align-items:center;gap:20px">
      <div style="width:44px;height:52px;border:3px solid #C8870B;border-radius:6px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 8px;box-sizing:border-box">
        <div style="position:absolute;top:-10px;left:11px;width:22px;height:12px;border:3px solid #C8870B;border-radius:3px;background:#FBF7EF;box-sizing:border-box"></div>
        <div style="height:3px;background:#C8870B;width:70%"></div>
        <div style="height:3px;background:#C8870B;width:100%"></div>
        <div style="height:3px;background:#C8870B;width:55%"></div>
      </div>
      <div style="font-family:Montserrat,sans-serif;font-weight:700;font-size:34px;letter-spacing:0.16em;color:#3B2A1C">{{ kicker }}</div>
    </div>
    <div style="margin-top:18px;width:340px;height:3px;background:#C8870B"></div>
  </div>

  <div style="position:absolute;top:300px;left:104px;width:640px;pointer-events:none;display:flex;flex-direction:column;gap:14px">
    <div style="font-family:Anton,sans-serif;font-size:150px;line-height:1.02;letter-spacing:-0.005em;color:#3B2A1C;text-transform:uppercase">{{ line1 }}<br />{{ line2 }}</div>
    <div style="font-family:Anton,sans-serif;font-size:150px;line-height:1.02;letter-spacing:-0.005em;text-transform:uppercase;background:linear-gradient(100deg,#B4780A 0%,#E9A81C 45%,#F5CB4A 60%,#C8870B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:6px">{{ line3 }}</div>
  </div>

  <div style="position:absolute;top:880px;left:64px;width:660px;box-sizing:border-box;background:#3B2A1C;border-radius:26px;padding:30px 36px;display:flex;align-items:center;gap:26px;pointer-events:none">
    <div style="flex:0 0 62px;width:62px;height:62px;border-radius:50%;background:#E9A81C;display:flex;align-items:center;justify-content:center">
      <div style="width:24px;height:13px;border-left:5px solid #3B2A1C;border-bottom:5px solid #3B2A1C;transform:rotate(-45deg) translate(2px,-3px)"></div>
    </div>
    <div style="font-size:31px;line-height:1.3;color:#FBF7EF;font-weight:400;white-space:nowrap">Os <strong style="color:#E9A81C;font-weight:700">{{ highlight }}</strong><br />{{ subline }}</div>
  </div>

  <svg viewBox="0 0 1080 300" preserveAspectRatio="none" style="position:absolute;left:0;bottom:60px;width:1080px;height:300px;pointer-events:none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 82 C 300 14 700 54 1080 148 L1080 300 L0 300 Z" fill="#C8870B"></path>
    <path d="M0 96 C 300 28 700 68 1080 162 L1080 300 L0 300 Z" fill="#3B2A1C"></path>
  </svg>

  <div style="position:absolute;left:88px;bottom:118px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none;white-space:nowrap">
    <img src="./assets/seucasorio-logo.png" alt="SeuCasório" style="width:380px;height:auto;display:block" />
    <div style="font-size:18px;font-weight:600;letter-spacing:0.24em;color:#DCC08C;padding-left:120px">SEU DIA, DO SEU JEITO</div>
  </div>

  <div style="position:absolute;left:0;bottom:0;width:1080px;height:60px;background:#E9A81C;display:flex;align-items:center;justify-content:center;pointer-events:none">
    <div style="font-size:18px;font-weight:600;letter-spacing:0.26em;color:#3B2A1C;white-space:nowrap">{{ tagline }}</div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1430},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GUIA PRÁTICO&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Fiquei&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Noiva.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;E agora?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;highlight&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4 primeiros passos&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;para começar sem estresse&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tagline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PLANEJE COM CONFIANÇA. VIVA CADA MOMENTO.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      kicker: p.kicker ?? "GUIA PRÁTICO",
      line1: p.line1 ?? "Fiquei",
      line2: p.line2 ?? "Noiva.",
      line3: p.line3 ?? "E agora?",
      highlight: p.highlight ?? "4 primeiros passos",
      subline: p.subline ?? "para começar sem estresse",
      tagline: p.tagline ?? "PLANEJE COM CONFIANÇA. VIVA CADA MOMENTO."
    };
  }
}

</script>
</body>
</html>

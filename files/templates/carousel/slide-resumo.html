<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Fraunces:ital,opsz,wght@1,9..144,500&family=Manrope:wght@500;700&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   POST 06 – Tendências (lista de 3) – black bg
   ========================================================= */

:root{
  --bg:        #0d0d0d;
  --ink:       #f4f1ea;
  --ink-mute:  #bcb6a7;
  --yellow:    #f0b829;
}

*, *::before, *::after { box-sizing: border-box; }

html, body{
  margin: 0;
  padding: 0;
  background: var(--bg);
  font-family: "Manrope", "Space Grotesk", system-ui, -apple-system, sans-serif;
}

.poster{
  width: 1080px;
  height: 1440px;
  background: var(--bg);
  color: var(--ink);
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 32px;
  padding: 72px 80px 64px;
  overflow: hidden;
  position: relative;
}

.eyebrow{
  display: flex;
  align-items: center;
  gap: 22px;
  font-family: "Manrope", sans-serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--yellow);
}
.eyebrow::before{
  content: "";
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--yellow);
}
.eyebrow .sep{ color: var(--yellow); }

.head-wrap{
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.headline{
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  font-size: 88px;
  line-height: .98;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin: 0 0 22px;
  text-transform: uppercase;
  text-wrap: balance;
}
.pill{
  background: var(--yellow);
  color: var(--bg);
  font-family: "Fraunces", serif;
  font-style: italic;
  font-weight: 500;
  font-size: 60px;
  line-height: 1;
  letter-spacing: -0.02em;
  padding: 10px 36px;
  display: inline-block;
}

/* list */
.list{
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-self: stretch;
  justify-content: space-evenly;
}
.item{
  padding: 22px 0;
  border-bottom: 2px dashed var(--yellow);
}
.item:first-child{ border-top: 2px dashed var(--yellow); }

/* suporte a <li class="item"> gerados pelo {{BULLETS}} */
.list li{
  padding: 22px 0;
  border-bottom: 2px dashed var(--yellow);
}
.list li:first-child{ border-top: 2px dashed var(--yellow); }

.item__title{
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  font-size: 36px;
  line-height: 1.05;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0 0 12px;
  text-transform: uppercase;
}
.item__body{
  font-family: "Manrope", sans-serif;
  font-weight: 500;
  font-size: 26px;
  line-height: 1.4;
  color: var(--ink-mute);
  margin: 0;
  max-width: 80%;
}

/* footer */
.foot{
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: "Manrope", sans-serif;
  font-size: 22px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-mute);
  padding-top: 8px;
}
.foot__right{
  text-transform: lowercase;
  letter-spacing: -0.01em;
  font-size: 28px;
  color: var(--yellow);
  display: flex;
  align-items: center;
  gap: 14px;
}
.foot__arr{
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  font-size: 36px;
}
</style>
</head>
<body>

  <article class="poster">

    <header class="eyebrow">
      Tend&ecirc;ncias <span class="sep">&middot;</span> Locais
      <span class="sep">&middot;</span> seuCas&oacute;rio
    </header>

    <section class="head-wrap">
      <h1 class="headline">Em resumo</h1>
      <span class="pill">em alta</span>
    </section>

    <ul class="list">
      {{BULLETS}}
    </ul>

    <footer class="foot">
      <span>seucasorio.com.br / not&iacute;cias</span>
      <span class="foot__right">
        arraste <span class="foot__arr">&rarr;</span>
      </span>
    </footer>

  </article>

</body>
</html>

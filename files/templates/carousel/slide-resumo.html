<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Fraunces:ital,opsz,wght@1,9..144,500&family=Manrope:wght@500;700&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   POST 06 – Em Resumo – black bg
   ========================================================= */

:root{
  --bg:        #0d0d0d;
  --ink:       #f4f1ea;
  --ink-mute:  #bcb6a7;
  --yellow:    #f0b829;
}

*, *::before, *::after { box-sizing: border-box; }

html, body{
  margin: 0;
  padding: 0;
  background: var(--bg);
  font-family: "Manrope", "Space Grotesk", system-ui, -apple-system, sans-serif;
}

.poster{
  width: 1080px;
  height: 1440px;
  background: var(--bg);
  color: var(--ink);
  display: grid;
  grid-template-rows: auto auto auto 1fr auto;
  padding: 120px 80px 64px;
  overflow: hidden;
  position: relative;
}

/* ---------- EYEBROW ---------- */
.eyebrow{
  display: flex;
  align-items: center;
  gap: 22px;
  font-family: "Manrope", sans-serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--yellow);
  margin-bottom: 120px;
}
.eyebrow::before{
  content: "";
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--yellow);
  flex-shrink: 0;
}
.eyebrow .sep{ color: var(--yellow); }

/* ---------- HEADING ---------- */
.head-wrap{
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  margin-bottom: 56px;
}
.headline{
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  font-size: 104px;
  line-height: .92;
  letter-spacing: -0.03em;
  color: var(--ink);
  margin: 0 0 28px;
  text-transform: uppercase;
}
.pill{
  background: var(--yellow);
  color: var(--bg);
  font-family: "Fraunces", serif;
  font-style: italic;
  font-weight: 500;
  font-size: 56px;
  line-height: 1;
  letter-spacing: -0.02em;
  padding: 10px 36px;
  display: inline-block;
}

/* ---------- LIST ---------- */
.list{
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 2px dashed rgba(188,182,167,.35);
  border-bottom: 2px dashed rgba(188,182,167,.35);
  display: flex;
  flex-direction: column;
  gap: 0;
  align-self: start;
}

.list li,
.item{
  padding: 26px 0 26px 4px;
  border-top: none;
  border-bottom: none;
}

.item__body,
.list li p{
  font-family: "Manrope", sans-serif;
  font-weight: 500;
  font-size: 34px;
  line-height: 1.4;
  color: var(--ink);
  margin: 0;
}

/* ---------- FOOTER ---------- */
.foot{
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: "Manrope", sans-serif;
  font-size: 22px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-mute);
  padding-top: 8px;
}
.foot__right{
  text-transform: lowercase;
  letter-spacing: -0.01em;
  font-size: 28px;
  color: var(--yellow);
  display: flex;
  align-items: center;
  gap: 14px;
}
.foot__arr{
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  font-size: 36px;
}
</style>
</head>
<body>

  <article class="poster">

    <header class="eyebrow">
      Tend&ecirc;ncias <span class="sep">&middot;</span> Locais
      <span class="sep">&middot;</span> seuCas&oacute;rio
    </header>

    <section class="head-wrap">
      <h1 class="headline">Em resumo</h1>
      <span class="pill">em alta</span>
    </section>

    <ul class="list">
      {{BULLETS}}
    </ul>

    <div><!-- espaço vazio --></div>

    <footer class="foot">
      <span>seucasorio.com.br / not&iacute;cias</span>
      <span class="foot__right">
        arraste <span class="foot__arr">&rarr;</span>
      </span>
    </footer>

  </article>

</body>
</html>

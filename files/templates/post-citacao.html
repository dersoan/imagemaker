<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<title>Post Editorial &mdash; Cita&ccedil;&atilde;o (capa de revista)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   POST EDITORIAL — CITA&Ccedil;&Atilde;O · estilo revista "MODA"
   Masthead gigante · foto full-bleed · frase de destaque
   1080 × 1440 · paleta seuCas&oacute;rio (marrom/creme)
   Placeholders (payload): {{IMAGEM_URL}} {{NUMERO}} {{EYEBROW}} {{QUOTE}} {{AUTOR}} {{CARGO}}
   ========================================================= */

:root{
  --brown:    #3c2517;
  --brown-d:  #2a1810;
  --cream:    #efe6d4;
  --cream-2:  #e4d6bf;
  --ink:      #2a1810;
  --yellow:   #f4c01a;
  --gold:     #b07d2a;
  --mute:     #6f5a45;
}

*, *::before, *::after { box-sizing: border-box; }

html, body{
  margin: 0; padding: 0;
  background: #1b1009;
  font-family: "Archivo", system-ui, sans-serif;
  color: var(--ink);
  min-height: 100vh;
  display: grid;
  place-items: start center;
}

.poster{
  width: 1080px;
  height: 1440px;
  position: relative;
  overflow: hidden;
  background: var(--cream-2);
  isolation: isolate;
}

/* ---------- PHOTO (full bleed) ---------- */
.photo{
  position: absolute;
  inset: 0;
  z-index: 0;
}
.photo img{ width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; display: block; }
.photo .ph{
  width: 100%; height: 100%;
  background:
    linear-gradient(135deg, rgba(0,0,0,.20), rgba(0,0,0,0) 50%),
    repeating-linear-gradient(135deg, var(--cream) 0 36px, var(--cream-2) 36px 72px);
}
/* warm duotone wash + top/bottom anchors so text reads */
.tint{
  position: absolute; inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(228,214,191,.95) 0%, rgba(228,214,191,.88) 30%, rgba(228,214,191,.55) 46%, rgba(228,214,191,.12) 58%, rgba(228,214,191,0) 66%),
    linear-gradient(0deg, rgba(42,24,16,.90) 0%, rgba(42,24,16,.40) 22%, rgba(42,24,16,0) 38%),
    linear-gradient(110deg, rgba(60,37,23,.16) 0%, rgba(60,37,23,0) 60%);
}

/* ---------- TOP RULE ---------- */
.toprule{
  position: absolute;
  top: 26px; left: 56px; right: 56px;
  z-index: 4;
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--ink);
  font-family: "Space Mono", monospace;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--brown);
}
.toprule .serif{
  font-family: "Playfair Display", serif;
  font-style: italic; font-weight: 500;
  font-size: 22px; letter-spacing: 0;
  text-transform: none;
  color: var(--gold);
}

/* ---------- MASTHEAD ---------- */
.masthead{
  position: absolute;
  top: 92px; left: 56px; right: 56px;
  z-index: 4;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.masthead h1{
  margin: 0;
  font-family: "Archivo", sans-serif;
  font-weight: 900;
  font-size: 132px;
  line-height: .8;
  letter-spacing: -.05em;
  color: var(--ink);
  text-transform: none;
}

/* ---------- QUOTE (headline) ---------- */
.lead{
  position: absolute;
  top: 300px; left: 56px;
  z-index: 4;
  width: 820px;
  display: grid;
  gap: 26px;
}
.lead .eyebrow{
  font-family: "Space Mono", monospace;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--gold);
  display: flex; align-items: center; gap: 14px;
}
.lead .eyebrow::after{ content:""; width: 64px; height: 2px; background: var(--gold); }
.lead .quotemark{
  font-family: "Playfair Display", serif;
  font-style: italic; font-weight: 600;
  font-size: 140px; line-height: .4; height: 70px;
  color: var(--gold);
}
.lead h2{
  margin: 0;
  font-family: "Archivo", sans-serif;
  font-weight: 800;
  font-size: 78px;
  line-height: .98;
  letter-spacing: -.03em;
  text-transform: uppercase;
  color: var(--ink);
  text-wrap: balance;
}
.lead h2 .serif{
  font-family: "Playfair Display", serif;
  font-style: italic; font-weight: 500;
  text-transform: none;
  letter-spacing: -.01em;
  color: var(--yellow);
  display: inline-block;
  background: #000;
  padding: 4px 18px 10px;
  margin-left: -4px;
}

/* ---------- BOTTOM (assinatura) ---------- */
.bottom{
  position: absolute;
  left: 56px; right: 56px; bottom: 56px;
  z-index: 4;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 30px;
  align-items: center;
}
.bottom__logo{
  width: 96px; height: 96px;
  display: grid; place-items: center;
  flex: none;
}
.bottom__logo img{ width: 100%; height: 100%; object-fit: contain; }
.bottom__text{ display: grid; gap: 8px; }
.bottom__title{
  margin: 0;
  font-family: "Archivo", sans-serif;
  font-weight: 800;
  font-size: 60px;
  line-height: .9;
  letter-spacing: -.035em;
  text-transform: uppercase;
  color: var(--cream);
}
.bottom__title .serif{
  font-family: "Playfair Display", serif;
  font-style: italic; font-weight: 500;
  text-transform: none;
  letter-spacing: -.01em;
  color: var(--yellow);
}
.bottom__sub{
  font-family: "Space Mono", monospace;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--cream);
}

@media (max-width: 1100px){
  .poster{
    transform-origin: top center;
    transform: scale(calc(100vw / 1080));
    margin-bottom: calc((1 - 100vw / 1080) * -1440px);
  }
}
</style>
</head>
<body>

  <article class="poster">

    <!-- PHOTO -->
    <div class="photo">
      <img src="{{IMAGEM_URL}}" alt="" />
    </div>
    <div class="tint" aria-hidden="true"></div>

    <!-- TOP RULE (fixo) -->
    <div class="toprule">
      <span>seuCas&oacute;rio &middot; Guia 2026</span>
      <span class="serif">edi&ccedil;&atilde;o especial</span>
      <span>{{NUMERO}}</span>
    </div>

    <!-- MASTHEAD (fixo) -->
    <header class="masthead">
      <h1>seuCas&oacute;rio</h1>
    </header>

    <!-- QUOTE -->
    <div class="lead">
      <span class="eyebrow">{{EYEBROW}}</span>
      <span class="quotemark" aria-hidden="true">&ldquo;</span>
      <h2>{{QUOTE}}</h2>
    </div>

    <!-- BOTTOM / assinatura -->
    <div class="bottom">
      <span class="bottom__logo">
        <img src="https://imagemaker.seucasorio.com/storage/LogoRedondo.png" alt="seuCas&oacute;rio" />
      </span>
      <span class="bottom__text">
        <span class="bottom__title">{{AUTOR}}</span>
        <span class="bottom__sub">{{CARGO}}</span>
      </span>
    </div>

  </article>

</body>
</html>
